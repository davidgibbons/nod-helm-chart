# The server execs into pod nod-browser-0, container runtime, by name.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nod-browser
  labels: {{- include "nod.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: nod-browser
  selector:
    matchLabels: {{- include "nod.selector" "browser" | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "nod.selector" "browser" | nindent 8 }}
      {{- with .Values.browser.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostname: nod-browser
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: runtime
          image: {{ include "nod.image" (dict "root" . "name" "browser") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - 'const s=require("node:net").connect("/data/control.sock");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1))'
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{- toYaml .Values.browser.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/node}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: home
          emptyDir: {sizeLimit: 256Mi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "nod.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.browser.persistence.size }}
