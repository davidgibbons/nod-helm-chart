{{- if not .Values.externalDatabase.secretName }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nod-postgres
  labels: {{- include "nod.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: nod-postgres
  selector:
    matchLabels: {{- include "nod.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "nod.selector" "postgres" | nindent 8 }}
      {{- with .Values.postgres.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: POSTGRES_USER, value: nod}
            - {name: POSTGRES_DB, value: nod}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nod.secret" . }}
                  key: NOD_POSTGRES_PASSWORD
            # A subdirectory, so the volume's lost+found does not block initdb.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: [pg_isready, -U, nod, -d, nod]
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "nod.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: nod-postgres
  labels: {{- include "nod.labels" . | nindent 4 }}
spec:
  selector: {{- include "nod.selector" "postgres" | nindent 4 }}
  ports:
    - {name: postgres, port: 5432}
---
# Only the server talks to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nod-postgres
  labels: {{- include "nod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "nod.selector" "postgres" | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "nod.selector" "server" | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
