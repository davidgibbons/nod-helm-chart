{{- if not .Values.existingSecret }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace "nod").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: nod
  labels: {{- include "nod.labels" . | nindent 4 }}
  annotations:
    # Losing NOD_VAULT_KEY makes every saved credential unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  NOD_AUTH_TOKEN: {{ $old.NOD_AUTH_TOKEN | default (randAlphaNum 64 | b64enc) }}
  NOD_VAULT_KEY: {{ $old.NOD_VAULT_KEY | default (randBytes 32 | b64enc) }}
  NOD_POSTGRES_PASSWORD: {{ $old.NOD_POSTGRES_PASSWORD | default (randAlphaNum 48 | b64enc) }}
{{- end }}
